<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cuide da sua paleta de cores</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e5ccff, #d6b3ff, #f0d9ff);
      color: #333;
      text-align: center;
      padding-top: 100px; /* espaço para o menu fixo */
    }

    /* === MENU SUPERIOR === */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #b073ff; /* roxo claro */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 70px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 10;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 25px;
      font-size: 18px;
      font-weight: 600;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    nav a:hover {
      color: #ffd6ff;
      transform: scale(1.1);
    }

    /* === CONTEÚDO PRINCIPAL === */
    h1 {
      font-weight: 700;
      font-size: 70px;
      color: #fff;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
      margin-bottom: 50px;
      transition: transform 0.3s ease;
    }

    h1:hover {
      transform: scale(1.05);
    }

    .galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding-bottom: 40px;
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .item img {
      width: 280px;
      height: 350px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .item:hover img {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .legenda {
      background-color: rgba(255, 255, 255, 0.85);
      padding: 10px 25px;
      border-radius: 25px;
      margin-top: 15px;
      font-size: 20px;
      font-weight: 600;
      border: 2px solid #b589d6;
      transition: transform 0.3s ease;
    }

    .item:hover .legenda {
      transform: scale(1.05);
    }

    @media (max-width: 900px) {
      h1 {
        font-size: 50px;
      }
      .item img {
        width: 230px;
        height: 300px;
      }
      nav a {
        font-size: 16px;
        margin: 0 15px;
      }
    }
  </style>
</head>
<body>

  <!-- MENU SUPERIOR -->
  <nav>
    <a href="mari maria makeup.html">Mari Maria Makeup</a>
    <a href="rare beauty2.html">Rare Beauty</a>
    <a href="marca3.html">Marca de Maquiagem 3</a>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <h1>Cuide da sua paleta de cores</h1>

  <div class="galeria">
    <div class="item">
      <img src="Clen.png" alt="Maquiagem clean">
      <div class="legenda">maquiagem clean</div>
    </div>

    <div class="item">
      <img src="vibrante.png" alt="Cores vibrantes">
      <div class="legenda">cores vibrantes</div>
    </div>

    <div class="item">
      <img src="escuras.png" alt="Cores escuras">
      <div class="legenda">cores escuras</div>
    </div>
  </div>

</body>
</html>
